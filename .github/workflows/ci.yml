name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: bash scripts/build-release.sh nightly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamisdvb-${{ github.sha }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish nightly
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
          if ! gh release view nightly >/dev/null 2>&1; then
            gh release create nightly --prerelease --title Nightly --notes "Latest verified main build."
          fi
          gh release upload nightly dist/* --clobber
          gh release edit nightly --prerelease --title Nightly --notes "Built from ${GITHUB_SHA}. Assets are replaced on each successful main build."
